name: ehcppo_pipeline
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.10

  # Core scientific stack
  - numpy=1.26
  - scipy
  - pandas
  - matplotlib
  - scikit-learn
  - scikit-image

  # PyTorch + CUDA (GPU)
  - pytorch=2.3
  - torchvision=0.18
  - torchaudio=2.3
  - pytorch-cuda=12.1  # Make sure your NVIDIA driver supports CUDA 12.1

  # Box2D (for CarRacing-v3)
  - box2d-py

  # System utilities
  - ffmpeg
  - swig
  - cmake
  - opencv
  - psutil

  # Dev tools
  - pip
  - setuptools
  - wheel
  - git

  # Jupyter (optional but handy)
  - jupyter
  - ipykernel
  - ipywidgets

  # Visualization
  - seaborn
  - plotly

  # TensorBoard via conda
  - tensorboard

  - pip:
      # Reinforcement Learning
      - gymnasium==0.29.1
      - pygame>=2.1.0

      # Diffusion Models & Transformers
      - diffusers>=0.20.0
      - transformers>=4.30.0
      - accelerate>=0.20.0
      - safetensors>=0.3.1
      - einops>=0.6.0

      # Data Processing / Video
      - imageio>=2.9.0
      - imageio-ffmpeg>=0.4.7
      - moviepy>=1.0.3

      # Config & Logging
      - omegaconf>=2.3.0
      - hydra-core>=1.3.0
      - wandb>=0.15.0
      - rich>=12.0.0
      - tqdm>=4.64.0

      # Optional: F1TENTH Environment
      # - f1tenth-gym

      # Dev & Testing
      - pytest>=7.0.0
      - black>=22.0.0
      - flake8>=5.0.0
      - isort>=5.10.0

      # Misc utilities
      - pyyaml>=6.0
      - packaging
      - requests
